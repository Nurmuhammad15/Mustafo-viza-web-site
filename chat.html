<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консультация — Mustafo Viza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: #06162e;
            color: #fff;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* HEADER */
        .chat-header {
            background: rgba(6,22,46,0.98);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .chat-header__back {
            color: rgba(255,255,255,0.7);
            font-size: 18px;
            text-decoration: none;
            width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px;
            transition: color 0.2s, background 0.2s;
        }
        .chat-header__back:hover { color: #eea91a; background: rgba(255,255,255,0.06); }
        .chat-header__avatar {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, #eea91a, #f5b82e);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }
        .chat-header__info { flex: 1; }
        .chat-header__name {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            line-height: 1.2;
        }
        .chat-header__status {
            font-size: 11px;
            color: #4ade80;
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 2px;
        }
        .chat-header__status::before {
            content: '';
            width: 6px; height: 6px;
            background: #4ade80;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* NAME SCREEN */
        #name-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 24px;
            text-align: center;
            overflow-y: auto;
        }
        .ns-icon {
            width: 80px; height: 80px;
            background: rgba(238,169,26,0.1);
            border: 2px solid rgba(238,169,26,0.25);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 34px;
            margin-bottom: 22px;
        }
        .ns-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        .ns-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 30px;
            line-height: 1.6;
            max-width: 300px;
        }
        .ns-input {
            width: 100%;
            max-width: 340px;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            padding: 14px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: #fff;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.2s;
        }
        .ns-input:focus { border-color: #eea91a; }
        .ns-input::placeholder { color: rgba(255,255,255,0.28); }
        .ns-btn {
            width: 100%;
            max-width: 340px;
            background: #eea91a;
            color: #06162e;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }
        .ns-btn:hover { background: #f5b82e; transform: scale(1.02); }

        /* CHAT SCREEN */
        #chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }

        .chat-day-label {
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.3);
            padding: 4px 0 8px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 78%;
            gap: 3px;
        }
        .msg--user { align-self: flex-end; align-items: flex-end; }
        .msg--manager { align-self: flex-start; align-items: flex-start; }

        .msg__name {
            font-size: 10px;
            font-weight: 700;
            color: #eea91a;
            padding: 0 4px;
        }
        .msg__bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .msg--user .msg__bubble {
            background: #eea91a;
            color: #06162e;
            border-bottom-right-radius: 4px;
            font-weight: 600;
        }
        .msg--manager .msg__bubble {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.09);
            color: #eee;
            border-bottom-left-radius: 4px;
        }
        .msg__time {
            font-size: 10px;
            color: rgba(255,255,255,0.3);
            padding: 0 4px;
        }

        /* Typing dots */
        .typing-wrap {
            display: none;
            align-self: flex-start;
        }
        .typing-dots {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 12px 16px;
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: dotAnim 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotAnim {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.35; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* INPUT */
        .chat-footer {
            padding: 10px 12px;
            background: rgba(6,22,46,0.98);
            border-top: 1px solid rgba(255,255,255,0.07);
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }
        .chat-input {
            flex: 1;
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 22px;
            padding: 11px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #fff;
            outline: none;
            resize: none;
            max-height: 110px;
            line-height: 1.45;
            transition: border-color 0.2s;
        }
        .chat-input:focus { border-color: #eea91a; }
        .chat-input::placeholder { color: rgba(255,255,255,0.28); }
        .send-btn {
            width: 44px; height: 44px;
            background: #eea91a;
            border: none;
            border-radius: 50%;
            color: #06162e;
            font-size: 15px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            transition: background 0.2s, transform 0.15s;
        }
        .send-btn:hover { background: #f5b82e; transform: scale(1.06); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    </style>
</head>
<body>

<header class="chat-header">
    <a href="javascript:history.back()" class="chat-header__back"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="chat-header__avatar">🛂</div>
    <div class="chat-header__info">
        <div class="chat-header__name">Mustafo Viza — Менеджер</div>
        <div class="chat-header__status">Онлайн</div>
    </div>
</header>

<!-- Экран 1: ввод имени -->
<div id="name-screen">
    <div class="ns-icon">💬</div>
    <h2 class="ns-title">Начать консультацию</h2>
    <p class="ns-sub">Введите ваше имя — менеджер ответит вам в ближайшее время</p>
    <input type="text" id="client-name" class="ns-input" placeholder="Ваше имя" maxlength="40" autocomplete="off">
    <button class="ns-btn" id="start-btn" onclick="startChat()">Начать чат →</button>
</div>

<!-- Экран 2: чат -->
<div id="chat-screen">
    <div class="chat-messages" id="messages">
        <div class="chat-day-label">Сегодня</div>
        <div class="typing-wrap" id="typing">
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    </div>
    <div class="chat-footer">
        <textarea class="chat-input" id="msg-input" placeholder="Напишите сообщение..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMsg()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>
</div>

<script>
const TOKEN = '8342368418:AAHGPeuT7QKVQPr_2643DqyRpxQk_ELFgSY';
const API = `https://api.telegram.org/bot${TOKEN}`;

let clientName = '';
let managerChatId = null;   // будет найден из getUpdates
let lastUpdateId = 0;
let polling = null;
// Сообщения которые мы сами отправили — не показываем как ответ менеджера
const myMsgTexts = new Set();

function nowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

async function startChat() {
    const inp = document.getElementById('client-name');
    clientName = inp.value.trim();
    if (!clientName) {
        inp.style.borderColor = '#ef4444';
        setTimeout(() => inp.style.borderColor = '', 1200);
        return;
    }

    document.getElementById('name-screen').style.display = 'none';
    const cs = document.getElementById('chat-screen');
    cs.style.display = 'flex';

    // Сначала получаем chat_id менеджера из getUpdates
    await fetchManagerChatId();

    // Отправляем уведомление менеджеру
    const intro = `🔔 *Yangi konsultatsiya so'rovi*\n\n👤 Mijoz ismi: *${clientName}*\n🕐 ${nowTime()}\n\n_Mijoz saytdan chat boshladi. Quyida uning savollari keladi._`;
    await tgSend(intro);

    // Показываем приветствие от менеджера с небольшой задержкой
    showTyping();
    setTimeout(() => {
        hideTyping();
        addMsg('manager', `Assalomu alaykum, ${clientName}! 👋\n\nMen Mustafo Viza menejeri. Savol va murojatingizni yozing — tez orada javob beraman.`);
    }, 1400);

    // Начинаем получать ответы менеджера
    startPolling();
}

async function fetchManagerChatId() {
    try {
        const res = await fetch(`${API}/getUpdates?limit=50`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
            for (const upd of data.result) {
                if (upd.update_id > lastUpdateId) lastUpdateId = upd.update_id;
                if (upd.message && !managerChatId) {
                    managerChatId = upd.message.chat.id;
                }
            }
        }
    } catch(e) { console.error('getUpdates error:', e); }
}

async function tgSend(text) {
    if (!managerChatId) return;
    myMsgTexts.add(text);
    try {
        await fetch(`${API}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: managerChatId,
                text: text,
                parse_mode: 'Markdown'
            })
        });
    } catch(e) { console.error('send error:', e); }
}

async function sendMsg() {
    const inp = document.getElementById('msg-input');
    const text = inp.value.trim();
    if (!text) return;

    inp.value = '';
    inp.style.height = 'auto';

    addMsg('user', text);

    const tgText = `💬 *${clientName}*:\n\n${text}`;
    await tgSend(tgText);

    showTyping();
    setTimeout(hideTyping, 3500);
}

function startPolling() {
    polling = setInterval(async () => {
        try {
            const res = await fetch(`${API}/getUpdates?offset=${lastUpdateId + 1}&timeout=1`);
            const data = await res.json();
            if (!data.ok) return;

            for (const upd of data.result) {
                lastUpdateId = upd.update_id;

                if (upd.message) {
                    const { text = '', chat, from } = upd.message;

                    // Сохраняем chat_id менеджера
                    if (!managerChatId) managerChatId = chat.id;

                    // Проверяем: это не наше сообщение
                    if (myMsgTexts.has(text)) continue;

                    // Это ответ менеджера — показываем
                    if (text && !text.startsWith('🔔') && !text.startsWith('💬')) {
                        hideTyping();
                        addMsg('manager', text);
                    }
                }
            }
        } catch(e) {}
    }, 2500);
}

function addMsg(type, text) {
    const container = document.getElementById('messages');
    const typing = document.getElementById('typing');

    const wrap = document.createElement('div');
    wrap.className = `msg msg--${type}`;

    if (type === 'manager') {
        const name = document.createElement('div');
        name.className = 'msg__name';
        name.textContent = 'Менеджер';
        wrap.appendChild(name);
    }

    const bubble = document.createElement('div');
    bubble.className = 'msg__bubble';
    bubble.textContent = text;
    wrap.appendChild(bubble);

    const time = document.createElement('div');
    time.className = 'msg__time';
    time.textContent = nowTime();
    wrap.appendChild(time);

    container.insertBefore(wrap, typing);
    container.scrollTop = container.scrollHeight;
}

function showTyping() {
    const t = document.getElementById('typing');
    t.style.display = 'flex';
    document.getElementById('messages').scrollTop = 99999;
}
function hideTyping() {
    document.getElementById('typing').style.display = 'none';
}

// Textarea auto-resize + Enter to send
document.addEventListener('DOMContentLoaded', () => {
    const ta = document.getElementById('msg-input');
    if (ta) {
        ta.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 110) + 'px';
        });
        ta.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });
    }
    const ni = document.getElementById('client-name');
    if (ni) ni.addEventListener('keydown', e => { if (e.key === 'Enter') startChat(); });
});
</script>
</body>
</html>
