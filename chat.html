<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Консультация — Mustafo Viza</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: #0d0d0d url('img_chat_bg.jpg') center center / cover no-repeat fixed;
            color: #fff;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.70);
            z-index: 0;
            pointer-events: none;
        }
        .topbar, #welcome, #chat-screen { position: relative; z-index: 1; }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 20px;
            flex-shrink: 0;
        }
        .topbar__back {
            color: rgba(255,255,255,0.5);
            font-size: 15px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 7px;
            transition: color 0.2s;
            font-weight: 500;
        }
        .topbar__back:hover { color: #eea91a; }
        .topbar__logo {
            display: flex;
            align-items: center;
            gap: 9px;
            text-decoration: none;
        }
        .topbar__logo img {
            width: 30px; height: 30px;
            border-radius: 7px;
        }
        .topbar__logo-name {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.85);
            letter-spacing: 0.5px;
        }
        .topbar__status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
        }
        .topbar__dot {
            width: 8px; height: 8px;
            background: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 6px #4ade80;
        }

        /* ── WELCOME SCREEN ── */
        #welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 20px 40px;
            text-align: center;
            gap: 0;
        }
        .welcome__title {
            font-size: clamp(22px, 5vw, 34px);
            font-weight: 700;
            color: #fff;
            margin-bottom: 48px;
            line-height: 1.3;
            letter-spacing: -0.5px;
        }
        .welcome__title span { color: #eea91a; }

        /* Input wrapper */
        .input-wrap {
            width: 100%;
            max-width: 680px;
            position: relative;
        }
        .input-wrap textarea {
            width: 100%;
            background: #1e1e1e;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 28px;
            padding: 18px 60px 18px 22px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            color: #fff;
            outline: none;
            resize: none;
            line-height: 1.5;
            max-height: 160px;
            min-height: 58px;
            transition: border-color 0.2s, background 0.2s;
        }
        .input-wrap textarea:focus {
            border-color: rgba(238,169,26,0.5);
            background: #222;
        }
        .input-wrap textarea::placeholder { color: rgba(255,255,255,0.3); font-size: 14px; }

        .input-wrap__send {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 36px; height: 36px;
            background: #eea91a;
            border: none;
            border-radius: 50%;
            color: #0d0d0d;
            font-size: 14px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: background 0.2s, transform 0.15s;
        }
        .input-wrap__send:hover { background: #f5c430; transform: scale(1.08); }

        /* Name input step */
        #name-step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .name-label {
            font-size: 13px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 2px;
        }
        .name-input-row {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .name-inp {
            flex: 1;
            background: #1e1e1e;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 12px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            color: #fff;
            outline: none;
            transition: border-color 0.2s;
        }
        .name-inp:focus { border-color: rgba(238,169,26,0.5); }
        .name-inp::placeholder { color: rgba(255,255,255,0.3); }
        .name-ok-btn {
            background: #eea91a;
            color: #0d0d0d;
            border: none;
            border-radius: 14px;
            padding: 12px 20px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .name-ok-btn:hover { background: #f5c430; }

        /* Suggestions */
        .suggestions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 16px;
            max-width: 680px;
        }
        .sugg-btn {
            background: #1e1e1e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 9px 16px;
            font-family: 'Montserrat', sans-serif;
            font-size: 12px;
            color: rgba(255,255,255,0.65);
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .sugg-btn:hover {
            background: #2a2a2a;
            color: #fff;
            border-color: rgba(238,169,26,0.4);
        }

        /* ── CHAT SCREEN ── */
        #chat-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            min-height: 0;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 10px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            scroll-behavior: smooth;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

        /* Message row */
        .msg-row {
            display: flex;
            gap: 12px;
            max-width: 780px;
            width: 100%;
        }
        .msg-row--user { align-self: flex-end; flex-direction: row-reverse; }
        .msg-row--manager { align-self: flex-start; }

        .msg-avatar {
            width: 34px; height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            margin-top: 2px;
        }
        .msg-avatar--manager {
            background: linear-gradient(135deg, #eea91a, #c47d00);
        }
        .msg-avatar--user {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .msg-body { display: flex; flex-direction: column; gap: 4px; }

        .msg-name {
            font-size: 11px;
            font-weight: 700;
            color: rgba(255,255,255,0.4);
            padding: 0 4px;
        }
        .msg-row--user .msg-name { text-align: right; color: rgba(238,169,26,0.6); }

        .msg-bubble {
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.6;
            word-break: break-word;
            white-space: pre-wrap;
            max-width: 520px;
        }
        .msg-row--manager .msg-bubble {
            background: #1e1e1e;
            color: #e8e8e8;
            border-bottom-left-radius: 5px;
        }
        .msg-row--user .msg-bubble {
            background: #2a2a2a;
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            border-bottom-right-radius: 5px;
        }
        .msg-time {
            font-size: 10px;
            color: rgba(255,255,255,0.22);
            padding: 0 4px;
        }

        /* Typing */
        .typing-row {
            display: none;
            align-self: flex-start;
            gap: 12px;
            align-items: center;
        }
        .typing-dots {
            display: flex; gap: 4px; align-items: center;
            background: #1e1e1e;
            padding: 13px 18px;
            border-radius: 20px;
            border-bottom-left-radius: 5px;
        }
        .typing-dots span {
            width: 6px; height: 6px;
            background: rgba(255,255,255,0.35);
            border-radius: 50%;
            animation: td 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes td {
            0%,60%,100% { transform: translateY(0); opacity:.3; }
            30% { transform: translateY(-5px); opacity:1; }
        }

        /* Bottom input in chat */
        .chat-footer {
            padding: 12px 16px 16px;
            flex-shrink: 0;
        }
        .chat-footer .input-wrap { margin: 0 auto; }

        /* Centered layout for desktop */
        @media (min-width: 700px) {
            .messages { padding: 24px 40px 10px; align-items: center; }
            .msg-row { max-width: 680px; }
            .chat-footer { padding: 12px 40px 20px; }
            #welcome { padding-bottom: 60px; }
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
    <a href="javascript:history.back()" class="topbar__back">
        <i class="fa-solid fa-arrow-left"></i> Назад
    </a>
    <a href="index.html" class="topbar__logo">
        <img src="logo.png" alt="logo">
        <span class="topbar__logo-name">MUSTAFO VIZA</span>
    </a>
    <div class="topbar__status">
        <div class="topbar__dot"></div>
        Онлайн
    </div>
</div>

<!-- WELCOME SCREEN -->
<div id="welcome">
    <h1 class="welcome__title">Что вас интересует?</h1>
    <div id="manager-hint" style="display:none; background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.3); border-radius:12px; padding:12px 18px; font-size:12px; color:#fca5a5; margin-bottom:16px; max-width:500px; text-align:center;">
        ⚠️ Менеджер ещё не подключён к боту. Пожалуйста, попробуйте позже.
    </div>

    <!-- Имя -->
    <div id="name-step">
        <div class="name-label">Введите ваше имя, чтобы начать</div>
        <div class="name-input-row">
            <input type="text" id="client-name" class="name-inp" placeholder="Ваше имя" maxlength="40" autocomplete="off">
            <button class="name-ok-btn" onclick="confirmName()">Готово</button>
        </div>
    </div>

    <!-- Input -->
    <div class="input-wrap">
        <textarea id="welcome-input" placeholder="Напишите вопрос..." rows="1" disabled></textarea>
        <button class="input-wrap__send" id="welcome-send" onclick="sendFirst()">
            <i class="fa-solid fa-arrow-up"></i>
        </button>
    </div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
    <div class="messages" id="messages">
        <div class="typing-row" id="typing">
            <div class="msg-avatar msg-avatar--manager">🛂</div>
            <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
    </div>
    <div class="chat-footer">
        <div class="input-wrap">
            <textarea id="chat-input" placeholder="Напишите сообщение..." rows="1"></textarea>
            <button class="input-wrap__send active" id="chat-send" onclick="sendMsg()">
                <i class="fa-solid fa-arrow-up"></i>
            </button>
        </div>
    </div>
</div>

<script>
const TOKEN = '8342368418:AAHGPeuT7QKVQPr_2643DqyRpxQk_ELFgSY';
const API   = `https://api.telegram.org/bot${TOKEN}`;

let clientName    = '';
// ВАЖНО: менеджер должен написать /start боту один раз
// После этого chat_id сохранится автоматически
let managerChatId = null;
let lastUpdateId  = 0;
let nameConfirmed = false;
const myTexts     = new Set();

/* ── helpers ── */
function nowTime() {
    const d = new Date();
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function showTyping()  { const t = document.getElementById('typing'); t.style.display='flex'; scrollBottom(); }
function hideTyping()  { document.getElementById('typing').style.display='none'; }
function scrollBottom(){ const m=document.getElementById('messages'); if(m) m.scrollTop=99999; }

/* ── name confirm ── */
function confirmName() {
    const inp = document.getElementById('client-name');
    const val = inp.value.trim();
    if (!val) { inp.style.borderColor='#ef4444'; setTimeout(()=>inp.style.borderColor='',1200); return; }
    clientName    = val;
    nameConfirmed = true;

    // Enable input
    const wi = document.getElementById('welcome-input');
    wi.disabled = false;
    wi.focus();

    // Hide name step
    document.getElementById('name-step').style.opacity = '0.4';
    document.getElementById('name-step').style.pointerEvents = 'none';
    document.querySelector('.name-label').textContent = `Привет, ${clientName}! Задайте ваш вопрос 👇`;

    fetchManagerChatId();
}

/* ── get manager chat_id ── */
async function fetchManagerChatId() {
    try {
        const res  = await fetch(`${API}/getUpdates?limit=100&allowed_updates=["message"]`);
        const data = await res.json();
        if (data.ok && data.result.length > 0) {
            // Take the LAST message's chat_id (most recent manager)
            for (const upd of data.result) {
                if (upd.update_id > lastUpdateId) lastUpdateId = upd.update_id;
                if (upd.message) {
                    managerChatId = upd.message.chat.id; // keep updating to get latest
                }
            }
            console.log('Manager chat_id found:', managerChatId);
        } else {
            console.warn('No updates found. Manager must send /start to the bot first!');
            // Show hint to user
            const hint = document.getElementById('manager-hint');
            if (hint) hint.style.display = 'block';
        }
    } catch(e) { console.error('fetchManagerChatId error:', e); }
}

/* ── send to TG ── */
async function tgSend(text) {
    if (!managerChatId) await fetchManagerChatId();
    if (!managerChatId) {
        console.error('Cannot send: manager chat_id unknown. Manager must /start the bot.');
        return;
    }
    myTexts.add(text);
    try {
        const resp = await fetch(`${API}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: managerChatId, text, parse_mode: 'Markdown' })
        });
        const result = await resp.json();
        if (!result.ok) console.error('TG send error:', result.description);
    } catch(e) { console.error('tgSend error:', e); }
}

/* ── switch to chat view ── */
function openChat() {
    document.getElementById('welcome').style.display     = 'none';
    const cs = document.getElementById('chat-screen');
    cs.style.display = 'flex';
}

/* ── add message bubble ── */
function addMsg(type, text) {
    const container = document.getElementById('messages');
    const typing    = document.getElementById('typing');

    const row = document.createElement('div');
    row.className = `msg-row msg-row--${type}`;

    const avatar = document.createElement('div');
    avatar.className = `msg-avatar msg-avatar--${type}`;
    avatar.textContent = type === 'manager' ? '🛂' : '👤';

    const body = document.createElement('div');
    body.className = 'msg-body';

    const name = document.createElement('div');
    name.className = 'msg-name';
    name.textContent = type === 'manager' ? 'Менеджер' : clientName;
    body.appendChild(name);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = text;
    body.appendChild(bubble);

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = nowTime();
    body.appendChild(time);

    if (type === 'user') { row.appendChild(body); row.appendChild(avatar); }
    else                  { row.appendChild(avatar); row.appendChild(body); }

    container.insertBefore(row, typing);
    scrollBottom();
}

/* ── send first message (welcome screen) ── */
async function sendFirst() {
    if (!nameConfirmed) { document.getElementById('client-name').focus(); return; }
    const inp  = document.getElementById('welcome-input');
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';

    openChat();

    // Intro notification
    const intro = `🔔 *Yangi konsultatsiya*\n\n👤 Mijoz: *${clientName}*\n🕐 ${nowTime()}`;
    await tgSend(intro);

    // User message
    addMsg('user', text);
    const tgText = `💬 *${clientName}*:\n\n${text}`;
    await tgSend(tgText);
    showTyping();
    startPolling();
}

/* ── quick suggestions ── */
function quickQ(q) {
    if (!nameConfirmed) { document.getElementById('client-name').focus(); return; }
    const inp = document.getElementById('welcome-input');
    inp.value = q;
    updateSendBtn();
    inp.focus();
}

/* ── send from chat screen ── */
async function sendMsg() {
    const inp  = document.getElementById('chat-input');
    const text = inp.value.trim();
    if (!text) return;
    inp.value = '';
    inp.style.height = 'auto';

    addMsg('user', text);
    const tgText = `💬 *${clientName}*:\n\n${text}`;
    await tgSend(tgText);
    showTyping();
}

/* ── poll for manager replies ── */
function startPolling() {
    setInterval(async () => {
        try {
            const res  = await fetch(`${API}/getUpdates?offset=${lastUpdateId+1}&timeout=1`);
            const data = await res.json();
            if (!data.ok) return;
            for (const upd of data.result) {
                lastUpdateId = upd.update_id;
                if (upd.message) {
                    const { text='', chat } = upd.message;
                    if (!managerChatId) managerChatId = chat.id;
                    if (text && !myTexts.has(text) && !text.startsWith('🔔') && !text.startsWith('💬')) {
                        hideTyping();
                        addMsg('manager', text);
                    }
                }
            }
        } catch(e) {}
    }, 2500);
}

/* ── send btn active state ── */
function updateSendBtn() {
    const val = document.getElementById('welcome-input').value.trim();
    document.getElementById('welcome-send').classList.toggle('active', val.length > 0);
}

/* ── textarea auto-resize ── */
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

document.addEventListener('DOMContentLoaded', () => {
    const wi = document.getElementById('welcome-input');
    wi.addEventListener('input', () => { autoResize(wi); updateSendBtn(); });
    wi.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendFirst(); }});

    const ci = document.getElementById('chat-input');
    ci.addEventListener('input', () => autoResize(ci));
    ci.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); sendMsg(); }});

    document.getElementById('client-name').addEventListener('keydown', e => { if(e.key==='Enter') confirmName(); });
});
</script>
</body>
</html>
